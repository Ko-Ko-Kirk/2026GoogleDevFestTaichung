[project]
name = "devfest-agent-security"
version = "0.1.0"
description = "Private preparation: LangGraph, Gemini, MCP and Model Armor security lab"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp>=2.3.0,<3",
  "langgraph>=1.2.14,<2",
  "langchain-google-genai>=4.5.2,<5",
  "google-cloud-modelarmor>=0.7.2,<1",
  "google-cloud-storage>=3.17.0,<4",
  "google-auth>=2.40,<3",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
runtime = ["google-cloud-agentplatform[agent-engines]>=2.4.0,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12", "shellcheck-py>=0.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devfest_security"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
